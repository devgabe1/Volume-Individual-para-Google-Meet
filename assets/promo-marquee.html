<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Promo 1400x560</title>
<!-- Bloco promocional de letreiro (marquee) da Chrome Web Store (1400x560).
     Gerado em PNG por scripts/build-store-images.py -->
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body {
    background: radial-gradient(90% 130% at 0% 0%, #2d2f33 0%, #202124 60%);
    color: #e8eaed; font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex; align-items: center; gap: 64px; padding: 0 110px; box-sizing: border-box;
  }
  img { width: 260px; height: 260px; flex: none; }
  h1 { font-size: 64px; line-height: 1.1; font-weight: 600; margin: 0 0 20px; }
  p { font-size: 28px; line-height: 1.4; margin: 0 0 28px; color: #bdc1c6; max-width: 820px; }
  .y { color: #fbbc04; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 10px; flex-wrap: wrap; }
  li { font-size: 18px; padding: 7px 14px; border-radius: 20px; background: #3c4043; color: #e8eaed; }
</style>
</head>
<body>
  <img src="icon.svg" alt="">
  <div>
    <h1>Volume <span class="y">individual</span><br>no Google Meet</h1>
    <p>Ajuste o volume de cada pessoa da chamada, como no Discord.</p>
    <ul>
      <li>0% a 200% por pessoa</li>
      <li>Nomes automáticos</li>
      <li>Volumes lembrados</li>
      <li>Nada sai do navegador</li>
    </ul>
  </div>
</body>
</html>
