<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Promo 440x280</title>
<!-- Bloco promocional pequeno da Chrome Web Store (440x280).
     Gerado em PNG por scripts/build-store-images.py -->
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 0% 0%, #2d2f33 0%, #202124 60%);
    color: #e8eaed; font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
    display: flex; align-items: center; gap: 22px; padding: 0 30px; box-sizing: border-box;
  }
  img { width: 112px; height: 112px; flex: none; }
  h1 { font-size: 26px; line-height: 1.15; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.4; margin: 0; color: #bdc1c6; }
  .y { color: #fbbc04; }
</style>
</head>
<body>
  <img src="../extension/icons/icon128.png" alt="">
  <div>
    <h1>Volume <span class="y">individual</span> no Google Meet</h1>
    <p>Ajuste o volume de cada pessoa da chamada, como no Discord.</p>
  </div>
</body>
</html>
